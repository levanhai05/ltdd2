name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Install & bundle check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-app
    env:
      # Giá trị giả chỉ để bundle; không cần secret thật trong CI
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder-key
      EXPO_PUBLIC_API_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: school-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor (cảnh báo, không chặn)
        run: npx expo-doctor
        continue-on-error: true

      - name: Bundle Android (kiểm tra code biên dịch được)
        run: npx expo export --platform android --output-dir dist

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: school-app/dist
          retention-days: 7