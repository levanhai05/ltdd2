name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']          # push tag v1.0.0 để build APK
  pull_request:
    branches: [main]
  workflow_dispatch:       # chạy tay trên tab Actions

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================= APP =================
  app-ci:
    name: App - Install & bundle check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-app
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder-key
      EXPO_PUBLIC_API_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: school-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor (cảnh báo, không chặn)
        run: npx expo-doctor
        continue-on-error: true

      - name: Bundle Android
        run: npx expo export --platform android --output-dir dist

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: school-app/dist
          retention-days: 7

  app-cd:
    name: App - Build APK (EAS)
    needs: app-ci
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-app
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: school-app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK (profile preview)
        run: eas build --platform android --profile preview --non-interactive --no-wait

  # ================= BACKEND =================
  backend-ci:
    name: Backend - Install & check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Kiểm tra cú pháp toàn bộ src/
        run: npm run check

      # Khi backend có script "test" (Jest/Supertest/node:test) thì bỏ comment 2 dòng dưới
      # - name: Chạy test API
      #   run: npm test

  backend-deploy:
    name: Backend - Deploy Render
    needs: backend-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Thiếu secret RENDER_DEPLOY_HOOK_URL"; exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"