name: CD - Build APK (EAS)

on:
  push:
    tags: ['v*']          # tạo tag v1.0.0 để tự build
  workflow_dispatch:       # hoặc bấm chạy tay trên tab Actions

jobs:
  eas-build:
    name: EAS build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-app
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: school-app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK (profile preview)
        run: eas build --platform android --profile preview --non-interactive --no-wait